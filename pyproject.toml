[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nthweekday"
version = "1.0.0"
description = "Find the nth weekday of a month (third Thursday, last Friday), read RFC 5545 BYDAY values, zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["calendar", "weekday", "nth weekday", "date", "rfc5545", "icalendar", "byday", "recurrence", "holidays"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "python-dateutil", "build", "twine"]

[project.scripts]
nthweekday = "nthweekday._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/nthweekday"
Issues = "https://github.com/JaviLianes8/nthweekday/issues"
Changelog = "https://github.com/JaviLianes8/nthweekday/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/nthweekday"]

[tool.hatch.build.targets.sdist]
# Upstream copies are fetched locally and never shipped; only their manifest is.
include = [
    "src",
    "tests",
    "scripts",
    "data/upstream/MANIFEST.json",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "requirements-dev.txt",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# python-dateutil is a test-only oracle and ships no type information.
module = ["dateutil", "dateutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not e2e'"
timeout = 300
markers = [
    "e2e: builds the wheel and installs it into a fresh venv (needs network); run with -m e2e",
]
